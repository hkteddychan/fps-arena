<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FPS Arena — Version Hub</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:radial-gradient(circle at 30% 20%, #1a2238, #0a0e1a);
         color:#eef; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang HK','Microsoft JhengHei',sans-serif; }
  .wrap { max-width:680px; padding:32px; text-align:center; }
  h1 { font-size:34px; margin-bottom:8px; }
  p.sub { color:#88a; margin-bottom:28px; }
  .card { display:flex; justify-content:space-between; align-items:center; gap:16px;
          background:#161d30; border:1px solid #2a3a55; border-radius:12px;
          padding:20px 24px; margin-bottom:16px; text-align:left; transition:.2s; }
  .card:hover { border-color:#4af; transform:translateY(-2px); }
  .card .info h3 { font-size:20px; color:#fff; }
  .card .info .desc { color:#9ab; font-size:14px; margin-top:6px; line-height:1.5; }
  .card .badge { color:#ffd24a; font-size:13px; margin-top:6px; }
  a.btn { flex-shrink:0; text-decoration:none; background:#2d7ff9; color:#fff; font-weight:bold;
          padding:10px 20px; border-radius:8px; font-size:15px; }
  a.btn:hover { background:#4a95ff; }
  a.btn.small { padding:8px 14px; font-size:13px; background:#2a3a55; }
  .row { display:flex; gap:10px; }
  .foot { margin-top:24px; color:#567; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 FPS Arena</h1>
  <p class="sub">揀一個版本開嚟玩。</p>

  <div class="card">
    <div class="info">
      <h3>🔫 V1 — 原版 FPS</h3>
      <div class="desc">第一身射擊 · WASD + 滑鼠 · 射擊武器 · 計分敵人</div>
      <div class="badge">⭐ 你最鍾意嗰個版本</div>
    </div>
    <a class="btn" href="v1-fps/">▶ 開玩</a>
  </div>

  <div class="card">
    <div class="info">
      <h3>🐴 V2 — IO 生存射擊 <span style="color:#f66;font-size:12px;">(實驗中)</span></h3>
      <div class="desc">一指搖桿 · 自動射擊 · 升級卡 · 波次生存(開發中,可能有 bug)</div>
    </div>
    <div class="row">
      <a class="btn small" href="v2-io/">▶ 試玩</a>
    </div>
  </div>

  <div class="foot">hkteddychan/fps-arena · GitHub Pages versioning</div>
</div>
</body>
</html>
