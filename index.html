<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ARENA SURVIVOR — 一指生存射擊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0d18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang HK','Noto Sans TC',sans-serif;user-select:none}
canvas{display:block;touch-action:none}
.screen{position:fixed;inset:0;background:rgba(8,10,20,.96);display:flex;align-items:center;justify-content:center;z-index:60;overflow-y:auto}
.screen.hidden{display:none}
.panel{width:min(460px,94vw);padding:24px;background:rgba(22,28,44,.98);border:2px solid #4af;border-radius:16px;text-align:center;box-shadow:0 0 50px rgba(68,170,255,.3)}
.panel h1{font-size:30px;margin-bottom:2px;color:#4af;letter-spacing:2px}
.panel h2{font-size:17px;color:#8ad;margin:4px 0 12px}
.panel .sub{color:#8ad;margin:8px 0;font-size:12px}
.panel input[type=text]{width:82%;padding:12px 14px;font-size:18px;border-radius:8px;border:2px solid #4af;background:#0a0d16;color:#fff;text-align:center;outline:none}
.panel .btn{display:inline-block;margin:8px 6px;padding:13px 32px;font-size:16px;font-weight:bold;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(180deg,#4af,#28c);color:#fff;letter-spacing:1px}
.panel .btn:hover{filter:brightness(1.15)}
.panel .btn.green{background:linear-gradient(180deg,#4f8,#2a6)}
.panel .btn.wide{display:block;width:100%;margin-top:8px}
table.score{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
table.score th{color:#4af;padding:5px;border-bottom:1px solid #335}
table.score td{padding:4px;border-bottom:1px solid #202840}
table.score tr.me{background:rgba(68,170,255,.16);font-weight:bold;color:#4af}
.modebtn{display:inline-block;padding:9px 12px;margin:5px 3px;border-radius:10px;border:2px solid #456;background:#141a2a;color:#cdf;cursor:pointer;font-size:13px}
.modebtn.on{border-color:#f80;background:rgba(255,136,0,.18);color:#f80;font-weight:bold}
#mobMsg{position:fixed;left:0;right:0;top:46px;text-align:center;z-index:20;font-size:13px;color:#ffd;text-shadow:1px 1px 3px #000;pointer-events:none;display:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#xpBarWrap{position:fixed;top:0;left:0;right:0;height:8px;background:rgba(0,0,0,.5)}
#xpBar{height:100%;background:linear-gradient(90deg,#4af,#8cf);width:0%;transition:width .2s}
#waveLabel{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:bold;color:#fff;text-shadow:1px 1px 3px #000;background:rgba(0,0,0,.45);padding:4px 14px;border-radius:10px;white-space:nowrap}
#timerLabel{position:fixed;top:42px;left:50%;transform:translateX(-50%);font-size:12px;color:#aaa;text-shadow:1px 1px 3px #000}
#hpWrap{position:fixed;bottom:18px;left:14px;width:46vw;max-width:220px;height:16px;background:rgba(0,0,0,.55);border:2px solid #456;border-radius:6px;overflow:hidden}
#hpBar{height:100%;background:linear-gradient(90deg,#4f4,#2a6);width:100%;transition:width .15s}
#hpText{position:fixed;bottom:18px;left:14px;width:46vw;max-width:220px;text-align:center;font-size:11px;font-weight:bold;color:#fff;text-shadow:1px 1px 2px #000;line-height:16px}
#killCount{position:fixed;bottom:18px;right:14px;font-size:13px;font-weight:bold;color:#ff5;text-shadow:1px 1px 3px #000;text-align:right}
#levelBadge{position:fixed;top:14px;left:14px;font-size:14px;font-weight:bold;color:#ff5;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:10px;border:1px solid #f80;min-width:42px;text-align:center}
#weaponsTag{position:fixed;top:14px;right:14px;font-size:11px;color:#cdf;background:rgba(0,0,0,.55);padding:5px 10px;border-radius:8px;max-width:50%;text-align:right}
#centerMsg{position:fixed;left:50%;top:35%;transform:translate(-50%,-50%);font-size:42px;font-weight:bold;color:#4af;text-shadow:0 0 25px #28c;z-index:6;opacity:0;transition:opacity .3s;white-space:nowrap;text-align:center;pointer-events:none}
#killPopup{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:6;font-weight:bold;color:#ff5;text-shadow:0 0 12px #f80;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none}
#damage{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 40%,rgba(255,0,0,.6) 100%);opacity:0;z-index:4}
#lowhp{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 55%,rgba(200,0,0,.45) 100%);opacity:0;z-index:4;transition:opacity .5s}
#damageFlash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
#joyZone{position:fixed;inset:0;z-index:7}
#upgradeOverlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:50}
#upgradeOverlay.hidden{display:none}
.upgPanel{width:min(440px,92vw);padding:18px;text-align:center}
.upgPanel h2{color:#ff5;font-size:24px;margin-bottom:6px;text-shadow:0 0 12px #f80}
.upgPanel .sub{color:#8ad;font-size:13px;margin-bottom:14px}
.upgCards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.upgCard{flex:1 1 110px;padding:14px 10px;background:rgba(30,40,60,.95);border:2px solid #456;border-radius:12px;cursor:pointer;color:#fff;font-size:13px;text-align:center;transition:transform .15s,border-color .15s}
.upgCard:hover{transform:translateY(-3px);border-color:#4af}
.upgCard .icon{font-size:34px;display:block;margin-bottom:4px}
.upgCard .name{color:#4af;font-weight:bold;font-size:14px;margin-bottom:3px}
.upgCard .desc{color:#aac;font-size:11px;line-height:1.3}
</style>
</head>
<body>

<div id="screen-name" class="screen">
  <div class="panel">
    <h1>🎮 ARENA SURVIVOR</h1>
    <h2>一指生存射擊 · IO 風格</h2>
    <input type="text" id="nameInput" maxlength="12" placeholder="輸入你嘅名字">
    <div style="margin-top:8px;font-size:11px;color:#8ad">個名會記低,下次自動載入</div>
    <div style="margin-top:12px;font-size:13px;color:#9cf">🎯 模式</div>
    <div id="modeSelect">
      <span class="modebtn on" data-mode="solo">👤 單人生存</span>
      <span class="modebtn" data-mode="race">🏁 計時生存賽</span>
      <span class="modebtn" data-mode="versus">⚔️ 雙人對戰(測試)</span>
    </div>
    <div style="margin-top:8px;font-size:11px;color:#8ad">單手指操控 · 自動射擊 · 升級強化 · 唔易死</div>
    <button class="btn green wide" id="btnStart">開始遊戲 ▶</button>
    <div class="sub" style="margin-top:14px">🏆 排行榜</div>
    <table class="score" id="scoreTable"></table>
  </div>
</div>

<div id="screen-over" class="screen hidden">
  <div class="panel">
    <h1 id="overTitle">💀 你死咗</h1>
    <div id="overStats" style="margin:14px 0;font-size:15px;color:#ffd"></div>
    <div class="sub">🏆 排行榜</div>
    <table class="score" id="overTable"></table>
    <div>
      <button class="btn" id="btnRetry">再玩一次 🔁</button>
      <button class="btn" id="btnMenu">主選單</button>
    </div>
  </div>
</div>

<div id="hud">
  <div id="xpBarWrap"><div id="xpBar"></div></div>
  <div id="waveLabel">WAVE 1</div>
  <div id="timerLabel">0:00</div>
  <div id="levelBadge">Lv 1</div>
  <div id="weaponsTag"></div>
  <div id="hpWrap"><div id="hpBar"></div></div>
  <div id="hpText">100/100</div>
  <div id="killCount">0 殺</div>
  <div id="mobMsg">🎮 撳住畫面任何位置出搖桿,拖去控制移動 · 自動射擊</div>
</div>
<div id="centerMsg"></div>
<div id="killPopup"></div>
<div id="damage"></div>
<div id="lowhp"></div>
<div id="damageFlash"></div>
<div id="joyZone"></div>

<div id="upgradeOverlay" class="hidden">
  <div class="upgPanel">
    <h2>⬆️ 升級!</h2>
    <div class="sub">揀一張強化卡(之後自動繼續遊戲)</div>
    <div class="upgCards" id="upgCards"></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
// ================= 音效 =================
let audioCtx=null;
function sound(t){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const c=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);switch(t){case'shoot':o.type='square';o.frequency.value=720;g.gain.setValueAtTime(.08,c);g.gain.exponentialRampToValueAtTime(.001,c+.05);o.stop(c+.05);break;case'bounce':o.type='triangle';o.frequency.value=200;g.gain.setValueAtTime(.1,c);g.gain.exponentialRampToValueAtTime(.001,c+.06);o.stop(c+.06);break;case'kill':o.type='sine';o.frequency.setValueAtTime(400,c);o.frequency.exponentialRampToValueAtTime(900,c+.18);g.gain.setValueAtTime(.15,c);g.gain.exponentialRampToValueAtTime(.001,c+.22);o.stop(c+.22);break;case'boss':o.type='sawtooth';o.frequency.value=80;g.gain.setValueAtTime(.25,c);g.gain.exponentialRampToValueAtTime(.001,c+.5);o.stop(c+.5);break;case'levelup':o.type='sine';o.frequency.setValueAtTime(500,c);o.frequency.setValueAtTime(800,c+.1);o.frequency.setValueAtTime(1100,c+.2);g.gain.setValueAtTime(.15,c);g.gain.exponentialRampToValueAtTime(.001,c+.35);o.stop(c+.35);break;case'hurt':o.type='sawtooth';o.frequency.value=110;g.gain.setValueAtTime(.22,c);g.gain.exponentialRampToValueAtTime(.001,c+.18);o.stop(c+.18);break;case'pickup':o.type='sine';o.frequency.setValueAtTime(700,c);o.frequency.setValueAtTime(1000,c+.08);g.gain.setValueAtTime(.12,c);g.gain.exponentialRampToValueAtTime(.001,c+.18);o.stop(c+.18);break;case'wave':o.type='square';o.frequency.value=520;g.gain.setValueAtTime(.12,c);g.gain.exponentialRampToValueAtTime(.001,c+.4);o.stop(c+.4);break;}}catch(e){}}

// ================= 名稱 + 排行榜 =================
const LS_NAME='surv_name',LS_SCORES='surv_scores';
let playerName=localStorage.getItem(LS_NAME)||'';
const nameInput=document.getElementById('nameInput');nameInput.value=playerName;if(!playerName)nameInput.focus();
function loadScores(){try{return JSON.parse(localStorage.getItem(LS_SCORES)||'[]')}catch(e){return[]}}
function saveScore(n,s,wave,kills,mode){const a=loadScores();a.push({n,s,w:wave,k:kills,m:mode,t:Date.now()});a.sort((x,y)=>y.s-x.s);localStorage.setItem(LS_SCORES,JSON.stringify(a.slice(0,10)));return a.slice(0,10)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
function renderScores(id){const t=document.getElementById(id),a=loadScores();t.innerHTML=a.length?'':'<tr><td style="color:#668">未有記錄</td></tr>';a.forEach((r,i)=>{const tr=document.createElement('tr');if(r.n===playerName)tr.className='me';tr.innerHTML=`<td>${i+1}</td><td>${esc(r.n)}</td><td>${r.s}</td><td>W${r.w}</td><td>${r.k||0}殺</td><td>${r.m||'solo'}</td>`;t.appendChild(tr)})}
renderScores('scoreTable');

// ================= 模式選擇 =================
let selectedMode='solo';
document.querySelectorAll('#modeSelect .modebtn').forEach(b=>{
  b.addEventListener('click',()=>{document.querySelectorAll('#modeSelect .modebtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');selectedMode=b.dataset.mode;});
});

// ================= Scene + 渲染 =================
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a2238);
scene.fog=new THREE.Fog(0x1a2238,60,160);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);
const camera=new THREE.OrthographicCamera(-window.innerWidth/2,window.innerWidth/2,window.innerHeight/2,-window.innerHeight/2,1,1000);
camera.position.set(0,0,10);
camera.lookAt(0,0,0);
const ambient=new THREE.AmbientLight(0xffffff,0.9);scene.add(ambient);

// ================= 場景背景 =================
const SCENE_SIZE=140;
function buildArena(){
  const g=new THREE.Group();
  // 地板
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(SCENE_SIZE*2,SCENE_SIZE*2),new THREE.MeshStandardMaterial({color:0x2a3a2a,roughness:.95}));
  floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;g.add(floor);
  // 格仔
  const grid=new THREE.GridHelper(SCENE_SIZE*2,40,0x3a4a3a,0x1a2a1a);g.add(grid);
  // 邊框牆
  const wallMat=new THREE.MeshStandardMaterial({color:0x3a3a4a});
  function wall(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,2,d),wallMat);m.position.set(x,1,z);g.add(m)}
  wall(0,-SCENE_SIZE,SCENE_SIZE*2,2);wall(0,SCENE_SIZE,SCENE_SIZE*2,2);wall(-SCENE_SIZE,0,2,SCENE_SIZE*2);wall(SCENE_SIZE,0,2,SCENE_SIZE*2);
  // 掩體
  const coverColors=[0x6a5a3a,0x5a6a3a,0x6a3a3a,0x3a6a6a];
  for(let i=0;i<28;i++){
    const s=2+Math.random()*3;
    const c=new THREE.Mesh(new THREE.BoxGeometry(s,s,s),new THREE.MeshStandardMaterial({color:coverColors[i%4],roughness:.7}));
    c.position.set((Math.random()-.5)*SCENE_SIZE*1.7,s/2,(Math.random()-.5)*SCENE_SIZE*1.7);
    c.rotation.y=Math.random()*Math.PI;g.add(c);
  }
  // 倉庫 / 高台
  const hub=new THREE.Mesh(new THREE.BoxGeometry(14,8,14),new THREE.MeshStandardMaterial({color:0x5a4a3a,roughness:.7}));
  hub.position.set(0,4,0);g.add(hub);
  return g;
}
const arena=buildArena();scene.add(arena);

// ================= 玩家 =================
const player=new THREE.Group();
const pBody=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.4,1.2),new THREE.MeshStandardMaterial({color:0x2266cc,emissive:0x113355}));
const pHead=new THREE.Mesh(new THREE.SphereGeometry(.55,16,16),new THREE.MeshStandardMaterial({color:0xffcc99}));
pHead.position.y=1.1;
const pEye=new THREE.Mesh(new THREE.BoxGeometry(.7,.18,.12),new THREE.MeshStandardMaterial({color:0x222}));
pEye.position.set(0,1.15,.5);
const pGun=new THREE.Mesh(new THREE.BoxGeometry(.3,.3,1),new THREE.MeshStandardMaterial({color:0x333333}));
pGun.position.set(.55,.1,.5);
player.add(pBody,pHead,pEye,pGun);
player.position.set(0,0,0);
scene.add(player);
// 玩家面向指示器
const playerAim=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,1.5),new THREE.MeshBasicMaterial({color:0x88ccff,transparent:true,opacity:.4}));
player.add(playerAim);

// ================= 子彈 + 視覺 =================
const bullets=[];
const BULLET_LIFE=4;
function spawnBullet(x,y,angle,opts={}){
  const speed=opts.speed||14;
  const dmg=opts.dmg||10;
  const pierce=opts.pierce||0;
  const isExplosive=opts.explosive||false;
  const color=opts.color||0xffff00;
  const size=opts.size||0.25;
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(size,8,8),new THREE.MeshBasicMaterial({color}));
  mesh.position.set(x,y,0.5);
  scene.add(mesh);
  bullets.push({mesh,x,y,dx:Math.cos(angle)*speed,dy:Math.sin(angle)*speed,life:BULLET_LIFE,dmg,pierce,isExplosive,r:size});
}

const enemies=[];
const ENEMY_DEFS={
  // 級別, 顏色, hp, speed, dmg, score, xp, 體型, 攻擊類型
  bug:    {lv:1,color:0x33dd33,hp:18,speed:3.5,dmg:6,score:5,xp:4,size:.8,r:'melee'},
  spitter:{lv:2,color:0xaa33cc,hp:30,speed:3,dmg:8,score:10,xp:8,size:.9,r:'shoot'},
  brute:  {lv:3,color:0xcc5533,hp:90,speed:2,dmg:14,score:25,xp:18,size:1.4,r:'melee'},
  tank:   {lv:4,color:0x666688,hp:180,speed:1.6,dmg:18,score:50,xp:35,size:1.7,r:'melee'},
  ghost:  {lv:5,color:0xaabbcc,hp:40,speed:5,dmg:10,score:30,xp:22,size:.85,r:'phasing'},
  boss:   {lv:9,color:0xcc2244,hp:1200,speed:1.2,dmg:30,score:500,xp:300,size:3.5,r:'boss'},
};

function spawnEnemy(type,x,y){
  const def=ENEMY_DEFS[type];
  const e=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(def.size,def.size*1.3,def.size),new THREE.MeshStandardMaterial({color:def.color,emissive:def.color,emissiveIntensity:0.15,roughness:.5}));
  body.castShadow=true;
  e.add(body);
  // 眼睛(令敵人睇落似生物)
  if(type!=='boss'){
    const eye=new THREE.Mesh(new THREE.BoxGeometry(def.size*.7,def.size*.18,def.size*.15),new THREE.MeshStandardMaterial({color:0x000}));
    eye.position.set(0,def.size*.15,def.size*.5);e.add(eye);
  }else{
    const core=new THREE.Mesh(new THREE.SphereGeometry(def.size*.3,16,16),new THREE.MeshBasicMaterial({color:0xff0000}));
    core.position.set(0,0,def.size*.6);e.add(core);
    // Boss 多隻眼
    for(let i=-1;i<=1;i++){const e2=new THREE.Mesh(new THREE.SphereGeometry(.3,12,12),new THREE.MeshBasicMaterial({color:0xff4444}));e2.position.set(i*.8,0,def.size*.6);e.add(e2);}
  }
  e.position.set(x,y,0.5);
  scene.add(e);
  e.position.set(x,y,0.5);enemies.push({mesh:e,type,x,y,hp:def.hp,maxHp:def.hp,speed:def.speed,dmg:def.dmg,score:def.score,xp:def.xp,size:def.size,r:def.r,attackCd:0,lastDir:{x:1,y:0},phasing:def.r==='phasing',isBoss:type==='boss'});
  return e;
}

// 敵人子彈
const eBullets=[];
function spawnEnemyBullet(x,y,angle,dmg,speed=6,color=0xff5500){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.25,8,8),new THREE.MeshBasicMaterial({color}));
  m.position.set(x,y,0.5);scene.add(m);
  eBullets.push({mesh:m,dx:Math.cos(angle)*speed,dy:Math.sin(angle)*speed,life:3,dmg});
}

// XP gems
const xpGems=[];
function spawnXP(x,y,amount){
  for(let i=0;i<Math.min(3,Math.ceil(amount/5));i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.4,.4,.2),new THREE.MeshBasicMaterial({color:0x44ffaa}));
    m.position.set(x+(Math.random()-.5)*1.5,y+(Math.random()-.5)*1.5,0.4);
    scene.add(m);xpGems.push({mesh:m,x:m.position.x,y:m.position.y,vx:0,vy:0,value:Math.ceil(amount/Math.min(3,Math.ceil(amount/5))),life:8});
  }
}

// 拾取箱
const pickups=[];
function spawnPickup(x,y,type){
  const color=type==='hp'?0xff3344:type==='xp'?0x44ffaa:type==='magnet'?0xffaa00:0xff44ff;
  const m=new THREE.Mesh(new THREE.BoxGeometry(.7,.7,.7),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9}));
  m.position.set(x,y,0.6);
  scene.add(m);
  pickups.push({mesh:m,type,x,y,life:12});
}

// 粒子
const particles=[];
function spawnParticle(x,y,color,count=8){
  for(let i=0;i<count;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.18),new THREE.MeshBasicMaterial({color,transparent:true}));
    m.position.set(x,y,0.5);scene.add(m);
    particles.push({mesh:m,dx:(Math.random()-.5)*8,dy:(Math.random()-.5)*8,life:.6});
  }
}

// 玩家子彈數據 (玩家有1把主槍,子彈由槍口射出, 自動瞄最近敵人)
const playerState={
  x:0,y:0,vx:0,vy:0,hp:100,maxHp:100,armor:0,maxArmor:50,
  level:1,xp:0,xpNext:10,score:0,kills:0,
  fireTimer:0,invuln:0,
  bulletCount:1,damage:10,fireRate:8,speed:14,bulletSize:0.25,
  pierce:0,explosive:false,regenHp:0,
  magnetR:0,explodeR:0,knockback:0,
  damageReduction:0,lifesteal:0,dash:false,
  weapons:[{id:'pistol',name:'🔫 手槍',damage:10,fireRate:8,speed:14,count:1,size:0.25,pierce:0,explosive:false}],
  damageFlash:0,wave:0,waveTimer:0,waveKills:0,
  timer:0,bossActive:false,facingAngle:0,mode:'solo',
};

// ================= 升級系統 =================
const UPGRADES=[
  {id:'dmg',icon:'⚔️',name:'傷害',desc:'子彈傷害 +20%',apply:s=>{s.damage*=1.2;}},
  {id:'rate',icon:'⚡',name:'射速',desc:'射速 +15%',apply:s=>{s.fireRate*=1.15;}},
  {id:'multi',icon:'🔫',name:'多重射擊',desc:'子彈數量 +1',apply:s=>{s.bulletCount++;}},
  {id:'speed',icon:'💨',name:'移動速度',desc:'走快啲',apply:s=>{s.speed*=1.12;}},
  {id:'pierce',icon:'🎯',name:'穿透',desc:'子彈穿透 +1',apply:s=>{s.pierce++;}},
  {id:'big',icon:'💥',name:'大彈',desc:'子彈大小 +30%',apply:s=>{s.bulletSize*=1.3;}},
  {id:'hp',icon:'❤️',name:'血量',desc:'最大 HP +25, 回滿',apply:s=>{s.maxHp+=25;s.hp=s.maxHp;}},
  {id:'regen',icon:'💚',name:'回血',desc:'每秒回 1 HP',apply:s=>{s.regenHp+=1;}},
  {id:'armor',icon:'🛡️',name:'護甲',desc:'最大護甲 +20, 回滿',apply:s=>{s.maxArmor+=20;s.armor=s.maxArmor;}},
  {id:'magnet',icon:'🧲',name:'磁鐵',desc:'XP 吸引範圍 +50%',apply:s=>{s.magnetR+=15;}},
  {id:'explode',icon:'💣',name:'爆炸',desc:'擊中爆炸 +範圍',apply:s=>{s.explosive=true;s.explodeR+=1.5;}},
  {id:'kb',icon:'🌀',name:'擊退',desc:'子彈擊退敵人',apply:s=>{s.knockback+=2;}},
  {id:'reduce',icon:'🛡️',name:'減傷',desc:'受傷 -15%',apply:s=>{s.damageReduction+=0.15;}},
  {id:'lifesteal',icon:'🩸',name:'吸血',desc:'擊殺回 3 HP',apply:s=>{s.lifesteal+=3;}},
];

let upgradePaused=false;
function pickUpgrades(){
  const pool=[...UPGRADES].sort(()=>Math.random()-.5).slice(0,3);
  const cards=document.getElementById('upgCards');
  cards.innerHTML='';
  pool.forEach(u=>{
    const c=document.createElement('div');c.className='upgCard';
    c.innerHTML=`<span class="icon">${u.icon}</span><div class="name">${u.name}</div><div class="desc">${u.desc}</div>`;
    c.onclick=()=>{
      u.apply(playerState);
      sound('levelup');
      upgradePaused=false;
      document.getElementById('upgradeOverlay').classList.add('hidden');
    };
    cards.appendChild(c);
  });
  upgradePaused=true;
  document.getElementById('upgradeOverlay').classList.remove('hidden');
}
function gainXP(amount){
  playerState.xp+=amount;
  while(playerState.xp>=playerState.xpNext){
    playerState.xp-=playerState.xpNext;
    playerState.level++;
    playerState.xpNext=Math.floor(playerState.xpNext*1.3);
    pickUpgrades();
  }
}

// ================= 玩家輸入 (1指搖桿) =================
let joyActive=false,joyId=null,joySX=0,joySY=0,joyDX=0,joyDY=0;
const joyZone=document.getElementById('joyZone');
joyZone.addEventListener('touchstart',e=>{
  e.preventDefault();if(joyActive)return;
  const t=e.changedTouches[0];
  joyId=t.identifier;joySX=t.clientX;joySY=t.clientY;joyDX=0;joyDY=0;joyActive=true;
},{passive:false});
joyZone.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      joyDX=t.clientX-joySX;joyDY=t.clientY-joySY;
      const len=Math.hypot(joyDX,joyDY),max=80;
      if(len>max){joyDX=joyDX/len*max;joyDY=joyDY/len*max;}
    }
  }
},{passive:false});
joyZone.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){if(t.identifier===joyId){joyActive=false;joyDX=0;joyDY=0;joyId=null;}}
});
const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true;});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

function findNearestEnemy(){
  let best=null,bestD=1e9;
  for(const e of enemies){
    const dx=e.x-playerState.x,dy=e.y-playerState.y;
    const d=Math.hypot(dx,dy);
    if(d<bestD){bestD=d;best={e,dx,dy};}
  }
  return best;
}

function autoShoot(dt){
  const target=findNearestEnemy();
  if(!target)return;
  const dx=target.dx,dy=target.dy;
  const angle=Math.atan2(dy,dx);
  playerState.facingAngle=angle;
  playerState.fireTimer-=dt;
  if(playerState.fireTimer<=0){
    playerState.fireTimer=1/playerState.fireRate;
    const n=playerState.bulletCount;
    const spread=n>1?0.18:0;
    for(let i=0;i<n;i++){
      const a=angle+(i-(n-1)/2)*spread;
      spawnBullet(playerState.x,playerState.y,a,{
        speed:playerState.speed*1.8,dmg:playerState.damage,
        pierce:playerState.pierce,explosive:playerState.explosive,
        size:playerState.bulletSize,color:0x88ffff,angle:a
      });
    }
    sound('shoot');
  }
}

// ================= 波次 =================
let waveTimer=0,waveEnemies=0,waveSpawned=0,waveKilled=0;
function startWave(){
  playerState.wave++;
  waveEnemies=Math.min(80,8+playerState.wave*3);
  waveSpawned=0;waveKilled=0;
  document.getElementById('waveLabel').textContent='WAVE '+playerState.wave;
  sound('wave');
  if(playerState.wave%5===0){
    const ang=Math.random()*Math.PI*2;
    spawnEnemy('boss',playerState.x+Math.cos(ang)*60,playerState.y+Math.sin(ang)*60);
    playerState.bossActive=true;sound('boss');
    showCenter('⚠️ BOSS 出現!','#f44');
  }
}
function spawnNext(){
  if(waveSpawned>=waveEnemies)return;
  const ang=Math.random()*Math.PI*2;
  const dist=70+Math.random()*20;
  let pool=['bug','bug','bug','spitter'];
  if(playerState.wave>=3)pool.push('spitter','bug');
  if(playerState.wave>=5)pool.push('brute');
  if(playerState.wave>=7)pool.push('tank','ghost');
  if(playerState.wave>=10)pool.push('tank','brute','elite');
  spawnEnemy(pool[Math.floor(Math.random()*pool.length)],playerState.x+Math.cos(ang)*dist,playerState.y+Math.sin(ang)*dist);
  waveSpawned++;
}

function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(!e.mesh.parent){enemies.splice(i,1);continue;}
    const dx=playerState.x-e.x,dy=playerState.y-e.y;
    const dist=Math.hypot(dx,dy);
    let nx=0,ny=0;
    if(dist>0){nx=dx/dist;ny=dy/dist;}
    if(e.r==='boss'){
      e.mesh.position.x+=nx*e.speed*dt*0.7;e.mesh.position.y+=ny*e.speed*dt*0.7;e.x=e.mesh.position.x;e.y=e.mesh.position.y;
      e.attackCd-=dt;
      if(e.attackCd<=0){e.attackCd=2;const base=Math.atan2(dy,dx);for(let k=0;k<6;k++)spawnEnemyBullet(e.x,e.y,base+(k-2.5)*0.3,15,5,0xff2244);}
      if(Math.random()<0.005)spawnEnemy('brute',e.x+(Math.random()-.5)*6,e.y+(Math.random()-.5)*6);
    }else if(e.r==='shoot'){
      if(dist>15){e.mesh.position.x+=nx*e.speed*dt;e.mesh.position.y+=ny*e.speed*dt;e.x=e.mesh.position.x;e.y=e.mesh.position.y;e.x=e.mesh.position.x;e.y=e.mesh.position.y;}
      else if(dist<8){e.mesh.position.x-=nx*e.speed*dt;e.mesh.position.y-=ny*e.speed*dt;}
      e.attackCd-=dt;
      if(e.attackCd<=0&&dist<25){e.attackCd=1.5;spawnEnemyBullet(e.x,e.y,Math.atan2(dy,dx),e.dmg,6,0xff66cc);}
    }else{
      e.mesh.position.x+=nx*e.speed*dt;e.mesh.position.y+=ny*e.speed*dt;e.x=e.mesh.position.x;e.y=e.mesh.position.y;e.x=e.mesh.position.x;e.y=e.mesh.position.y;
      if(dist<e.size+1){e.attackCd-=dt;if(e.attackCd<=0){e.attackCd=e.isBoss?1.2:1;damagePlayer(e.dmg);}}else e.attackCd=0;
    }
    if(e.hp<=0){
      scene.remove(e.mesh);
      spawnParticle(e.x,e.y,e.mesh.children[0].material.color.getHex(),e.isBoss?40:14);
      spawnXP(e.x,e.y,e.xp);
      playerState.score+=e.score;playerState.kills++;waveKilled++;
      if(Math.random()<0.18)spawnPickup(e.x,e.y,'hp');
      if(Math.random()<0.06)spawnPickup(e.x,e.y,'magnet');
      if(e.isBoss){playerState.bossActive=false;showCenter('✅ BOSS 擊敗!','#ff5');}
      enemies.splice(i,1);sound('kill');
      if(playerState.lifesteal)playerState.hp=Math.min(playerState.maxHp,playerState.hp+playerState.lifesteal);
    }
    if(e.r!=='boss')e.mesh.rotation.z=Math.atan2(ny,nx);
  }
}

function damagePlayer(d){
  if(playerState.invuln>0||upgradePaused)return;
  let dmg=d;
  if(playerState.armor>0){const soak=Math.min(playerState.armor,d*.6);playerState.armor-=soak;dmg-=soak;}
  dmg=dmg*(1-playerState.damageReduction);
  if(dmg<1)dmg=1;
  playerState.hp-=dmg;
  playerState.invuln=0.4;
  document.getElementById('damage').style.opacity=0.7;
  setTimeout(()=>{document.getElementById('damage').style.opacity=0;},120);
  sound('hurt');
  if(playerState.hp<=0){playerState.hp=0;gameOver();}
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.dx*dt;b.y+=b.dy*dt;b.life-=dt;
    b.mesh.position.x=b.x;b.mesh.position.y=b.y;
    if(b.life<=0||Math.abs(b.x)>SCENE_SIZE||Math.abs(b.y)>SCENE_SIZE){
      if(b.isExplosive)explode(b.x,b.y);
      scene.remove(b.mesh);bullets.splice(i,1);continue;
    }
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.size+b.r){
        e.hp-=b.dmg;
        if(playerState.knockback&&b.angle!==undefined){
          e.x+=Math.cos(b.angle)*playerState.knockback*0.15;
          e.y+=Math.sin(b.angle)*playerState.knockback*0.15;
          e.mesh.position.set(e.x,e.y,0.5);
        }
        spawnParticle(b.x,b.y,0xffaa00,3);
        if(b.pierce>0){b.pierce--;continue;}
        if(b.isExplosive)explode(b.x,b.y);
        scene.remove(b.mesh);bullets.splice(i,1);break;
      }
    }
  }
}
function explode(x,y){
  spawnParticle(x,y,0xff8800,20);sound('bounce');
  for(const e of enemies){
    if(Math.hypot(e.x-x,e.y-y)<(playerState.explodeR||4)){e.hp-=30;spawnParticle(e.x,e.y,0xff4400,5);}
  }
}

function updateEnemyBullets(dt){
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i];
    b.mesh.position.x+=b.dx*dt;b.mesh.position.y+=b.dy*dt;b.life-=dt;
    if(b.life<=0||Math.abs(b.mesh.position.x)>SCENE_SIZE||Math.abs(b.mesh.position.y)>SCENE_SIZE){scene.remove(b.mesh);eBullets.splice(i,1);continue;}
    if(Math.hypot(b.mesh.position.x-playerState.x,b.mesh.position.y-playerState.y)<1.2){damagePlayer(b.dmg);scene.remove(b.mesh);eBullets.splice(i,1);}
  }
}

function updateXP(dt){
  for(let i=xpGems.length-1;i>=0;i--){
    const g=xpGems[i];
    g.life-=dt;
    const dx=playerState.x-g.x,dy=playerState.y-g.y;
    const d=Math.hypot(dx,dy);
    if(d<2.5+playerState.magnetR){g.vx+=dx/d*40*dt;g.vy+=dy/d*40*dt;}
    g.vx*=.92;g.vy*=.92;
    g.x+=g.vx*dt;g.y+=g.vy*dt;
    g.mesh.position.x=g.x;g.mesh.position.y=g.y;
    if(d<1){gainXP(g.value);sound('pickup');scene.remove(g.mesh);xpGems.splice(i,1);}
    else if(g.life<=0){scene.remove(g.mesh);xpGems.splice(i,1);}
  }
}

function updatePickups(dt){
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    p.life-=dt;p.mesh.rotation.y+=dt*2;
    const d=Math.hypot(p.x-playerState.x,p.y-playerState.y);
    if(d<2.5+playerState.magnetR){
      p.x+=(playerState.x-p.x)*dt*8;p.y+=(playerState.y-p.y)*dt*8;
      p.mesh.position.x=p.x;p.mesh.position.y=p.y;
    }
    if(d<1.5){
      if(p.type==='hp'){playerState.hp=Math.min(playerState.maxHp,playerState.hp+30);showCenter('❤️ +30 HP','#4f4');}
      else if(p.type==='magnet'){playerState.magnetR+=20;showCenter('🧲 磁鐵!','#ff5');}
      sound('pickup');scene.remove(p.mesh);pickups.splice(i,1);
    }else if(p.life<=0){scene.remove(p.mesh);pickups.splice(i,1);}
  }
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;p.mesh.position.x+=p.dx*dt;p.mesh.position.y+=p.dy*dt;
    p.dx*=.94;p.dy*=.94;p.mesh.material.opacity=Math.max(0,p.life/.6);
    if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1);}
  }
}

function showCenter(t,color='#4af'){
  const el=document.getElementById('centerMsg');
  el.textContent=t;el.style.color=color;el.style.opacity=1;
  setTimeout(()=>el.style.opacity=0,1500);
}

// ================= 主循環 =================
let running=false;window.__gameDebug=()=>({running,playerState,enemiesCount:enemies.length,bulletsCount:bullets.length,waveTimer,waveSpawned,waveEnemies,enemiesSample:enemies.slice(0,3).map(e=>({x:e.x,y:e.y,hp:e.hp,size:e.size,r:e.r,mx:e.mesh.position.x,my:e.mesh.position.y}))});
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);
  if(!running||upgradePaused){renderer.render(scene,camera);return;}
  // 玩家移動
  let mx=0,my=0;
  if(joyActive){mx=joyDX/80;my=joyDY/80;}
  else{
    if(keys['KeyW'])my=-1;else if(keys['KeyS'])my=1;
    if(keys['KeyA'])mx=-1;else if(keys['KeyD'])mx=1;
  }
  const spd=playerState.speed*dt;
  playerState.x+=mx*spd;playerState.y+=my*spd;
  playerState.x=Math.max(-SCENE_SIZE+2,Math.min(SCENE_SIZE-2,playerState.x));
  playerState.y=Math.max(-SCENE_SIZE+2,Math.min(SCENE_SIZE-2,playerState.y));
  player.position.x=playerState.x;player.position.y=playerState.y;
  if(mx||my){player.rotation.z=Math.atan2(my,mx);playerState.facingAngle=player.rotation.z;}
  else if(joyActive){player.rotation.z=Math.atan2(joyDY,joyDX);playerState.facingAngle=player.rotation.z;}
  camera.position.x=playerState.x;camera.position.y=playerState.y;
  arena.position.x=-playerState.x;arena.position.y=-playerState.y;

  autoShoot(dt);
  if(!playerState.bossActive){
    waveTimer-=dt;
    if(waveTimer<=0){waveTimer=0.5;spawnNext();}
    if(waveSpawned>=waveEnemies&&enemies.length===0){waveTimer=3;startWave();}
  }
  updateEnemies(dt);updateBullets(dt);updateEnemyBullets(dt);
  updateXP(dt);updatePickups(dt);updateParticles(dt);

  if(playerState.invuln>0){playerState.invuln-=dt;player.visible=Math.floor(playerState.invuln*10)%2===0;}else player.visible=true;
  if(playerState.regenHp>0)playerState.hp=Math.min(playerState.maxHp,playerState.hp+playerState.regenHp*dt);
  if(playerState.armor<playerState.maxArmor)playerState.armor=Math.min(playerState.maxArmor,playerState.armor+2*dt);
  playerState.timer+=dt;

  // 計時賽 90 秒
  if(playerState.mode==='race'&&playerState.timer>=90){gameOver();return;}

  updateHUD();
  renderer.render(scene,camera);
}

function updateHUD(){
  document.getElementById('hpBar').style.width=(Math.max(0,playerState.hp)/playerState.maxHp*100)+'%';
  document.getElementById('hpBar').style.background=playerState.hp>60?'linear-gradient(90deg,#4f4,#2a6)':playerState.hp>30?'linear-gradient(90deg,#ff4,#f80)':'linear-gradient(90deg,#f44,#a00)';
  document.getElementById('hpText').textContent=`${Math.max(0,Math.round(playerState.hp))}/${playerState.maxHp}`;
  document.getElementById('xpBar').style.width=(playerState.xp/playerState.xpNext*100)+'%';
  document.getElementById('levelBadge').textContent='Lv '+playerState.level;
  document.getElementById('killCount').textContent=`${playerState.kills}殺 · ${playerState.score}分`;
  let ws='';
  if(playerState.bulletCount>1)ws+=`x${playerState.bulletCount} `;
  if(playerState.pierce)ws+=`穿+${playerState.pierce} `;
  if(playerState.explosive)ws+='💥 ';
  if(playerState.knockback)ws+='🌀 ';
  if(playerState.lifesteal)ws+='🩸 ';
  document.getElementById('weaponsTag').textContent=ws;
  document.getElementById('lowhp').style.opacity=playerState.hp<30&&playerState.hp>0?1:0;
  document.getElementById('timerLabel').textContent=playerState.mode==='race'?`⏱ ${Math.floor(playerState.timer)}/90s`:(Math.floor(playerState.timer)+'s');
}

function startGame(){
  playerName=(nameInput.value||'玩家').trim().slice(0,12)||'玩家';
  localStorage.setItem(LS_NAME,playerName);
  document.getElementById('screen-name').classList.add('hidden');
  document.getElementById('hud').style.display='block';
  document.getElementById('mobMsg').style.display='block';
  setTimeout(()=>document.getElementById('mobMsg').style.display='none',4000);
  Object.assign(playerState,{
    x:0,y:0,hp:100,maxHp:100,armor:0,maxArmor:50,
    level:1,xp:0,xpNext:10,score:0,kills:0,
    bulletCount:1,damage:10,fireRate:8,speed:14,bulletSize:0.25,
    pierce:0,explosive:false,regenHp:0,magnetR:0,explodeR:0,
    knockback:0,damageReduction:0,lifesteal:0,
    wave:0,timer:0,bossActive:false,invuln:0,fireTimer:0,mode:selectedMode,
  });
  enemies.forEach(e=>scene.remove(e.mesh));enemies.length=0;
  bullets.forEach(b=>scene.remove(b.mesh));bullets.length=0;
  eBullets.forEach(b=>scene.remove(b.mesh));eBullets.length=0;
  xpGems.forEach(g=>scene.remove(g.mesh));xpGems.length=0;
  pickups.forEach(p=>scene.remove(p.mesh));pickups.length=0;
  particles.forEach(p=>scene.remove(p.mesh));particles.length=0;
  waveTimer=1;startWave();
  running=true;
}

function gameOver(){
  running=false;sound('hurt');
  saveScore(playerName,playerState.score,playerState.wave,playerState.kills,playerState.mode);
  document.getElementById('overTitle').textContent=playerState.mode==='race'?'⏱ 限時結束!':'💀 你被圍毆了';
  document.getElementById('overStats').innerHTML=`玩家:<b>${esc(playerName)}</b><br>得分:<b style="color:#ff5">${playerState.score}</b><br>殺敵:<b>${playerState.kills}</b> · 存活:<b>${Math.floor(playerState.timer)}s</b> · 波次:<b>W${playerState.wave}</b>`;
  renderScores('overTable');
  document.getElementById('screen-over').classList.remove('hidden');
  document.getElementById('hud').style.display='none';
}

document.getElementById('btnStart').addEventListener('click',startGame);
document.getElementById('btnRetry').addEventListener('click',startGame);
document.getElementById('btnMenu').addEventListener('click',()=>{document.getElementById('screen-over').classList.add('hidden');document.getElementById('screen-name').classList.remove('hidden');renderScores('scoreTable');});
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')startGame();});

function unlock(){if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
document.addEventListener('touchstart',unlock,{once:true,passive:true});
document.addEventListener('click',unlock,{once:true});

window.addEventListener('resize',()=>{
  camera.left=-window.innerWidth/2;camera.right=window.innerWidth/2;
  camera.top=window.innerHeight/2;camera.bottom=-window.innerHeight/2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

loop();
</script>
</body>
