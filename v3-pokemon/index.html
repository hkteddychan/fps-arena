<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pokemon Arena (V3.2)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#1a2238; color:#eef; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang HK',sans-serif; overflow:hidden; height:100vh; touch-action:none; user-select:none; }
  #wrap { width:100vw; height:100vh; display:flex; flex-direction:column; }
  #hud { height:56px; background:rgba(10,14,26,.92); display:flex; align-items:center; justify-content:space-between; padding:0 10px; border-bottom:2px solid #2a3a55; z-index:5; flex-shrink:0; }
  #hud .brand { font-size:15px; font-weight:bold; }
  #hud .timer { font-size:19px; font-weight:bold; color:#ffd24a; }
  #hud .score { font-size:13px; }
  #gamewrap { flex:1; position:relative; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; background:#3a8f4f; }
  #joy { position:absolute; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.12); bottom:104px; left:14px; touch-action:none; }
  #joy .knob { position:absolute; width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.5); left:32px; top:32px; }
  /* 底部控制 */
  #controls { position:absolute; left:0; right:0; bottom:0; height:88px; background:rgba(10,14,26,.8); backdrop-filter:blur(3px); border-top:2px solid #2a3a55; display:none; z-index:6; align-items:center; justify-content:space-between; padding:0 14px; }
  #controls button { border:none; border-radius:12px; color:#fff; font-weight:bold; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; box-shadow:0 3px 8px rgba(0,0,0,.35); }
  #controls .btn-icon { font-size:20px; line-height:1; margin-bottom:3px; }
  #throwBtn { width:76px; height:76px; border-radius:50%; background:radial-gradient(circle,#ff5a3c,#c2300f); border:3px solid #fff; font-size:11px; }
  #modeBtn { width:84px; height:64px; background:#2d7ff9; }
  #summonBtn { width:84px; height:64px; background:#28a745; }
  /* 物品箱 */
  #bag { position:absolute; top:6px; right:6px; background:rgba(10,14,26,.82); border-radius:10px; padding:5px 7px; z-index:6; font-size:11px; max-width:44vw; }
  #bag .title { color:#ffd24a; font-weight:bold; margin-bottom:3px; }
  #bag .slots { display:flex; gap:3px; flex-wrap:wrap; }
  #bag .slot { width:30px; height:30px; border-radius:7px; background:#26334d; display:flex; align-items:center; justify-content:center; font-size:14px; border:1px solid #3a4d6e; position:relative; }
  #bag .slot.empty { opacity:.3; }
  #bag .slot.active { border-color:#ffd24a; box-shadow:0 0 6px #ffd24a; }
  #bag .slot .hpmini { position:absolute; bottom:1px; left:3px; right:3px; height:3px; background:#333; border-radius:1px; }
  #bag .slot .hpmini i { display:block; height:100%; background:#4caf50; }
  #modeState { position:absolute; top:6px; left:6px; background:rgba(10,14,26,.82); border-radius:8px; padding:4px 8px; font-size:12px; z-index:6; display:none; }
  #modeState .m { color:#9ab; } #modeState .v { color:#ffd24a; font-weight:bold; }
  #catchHint { position:absolute; left:50%; top:60px; transform:translateX(-50%); background:rgba(255,210,74,.25); border:1px solid #ffd24a; color:#ffd24a; border-radius:8px; padding:4px 12px; font-size:13px; z-index:6; display:none; }
  #modeMenu { position:absolute; right:12px; bottom:100px; background:rgba(10,14,26,.96); border:1px solid #2a3a55; border-radius:12px; padding:8px; z-index:8; display:none; flex-direction:column; gap:6px; }
  #modeMenu button { border:none; border-radius:8px; padding:8px 18px; font-size:14px; font-weight:bold; color:#fff; text-align:left; }
  #modeMenu button:hover { filter:brightness(1.2); }
  .overlay { position:absolute; inset:0; background:rgba(6,10,20,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; text-align:center; padding:18px; }
  .overlay h1 { font-size:28px; margin-bottom:4px; }
  .overlay p { color:#9ab; font-size:13px; margin:6px 0; line-height:1.6; max-width:330px; }
  #pick h2 { color:#ffd24a; font-size:18px; margin:14px 0 4px; }
  #pick .ch { display:flex; gap:12px; margin-top:10px; }
  #pick .c { width:96px; background:#161d30; border:2px solid #2a3a55; border-radius:14px; padding:12px 6px; cursor:pointer; transition:.15s; }
  #pick .c.sel { border-color:#ffd24a; box-shadow:0 0 10px rgba(255,210,74,.4); transform:translateY(-2px); }
  #pick .c .emo { font-size:36px; }
  #pick .c .nm { font-size:14px; font-weight:bold; margin-top:6px; }
  #pick .c .tp { font-size:11px; color:#9ab; margin-top:2px; }
  #pick .c .st { font-size:10px; color:#88a; margin-top:4px; }
  #pick button { background:#2d7ff9; color:#fff; border:none; font-size:18px; font-weight:bold; padding:12px 32px; border-radius:12px; margin-top:12px; }
  #end h2 { font-size:25px; margin-bottom:8px; }
  #end .big { font-size:20px; color:#ffd24a; margin:6px 0; }
  #end .det { font-size:13px; color:#9ab; line-height:1.8; }
  #end button { background:#2d7ff9; color:#fff; border:none; font-size:17px; font-weight:bold; padding:11px 28px; border-radius:12px; margin-top:12px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span class="brand">🎮 Pokemon Arena</span>
    <span class="timer" id="timer">5:00</span>
    <span class="score" id="score">捉 0</span>
  </div>
  <div id="gamewrap">
    <canvas id="cv"></canvas>
    <div id="joy"><div class="knob" id="knob"></div></div>
    <div id="modeState"><span class="m">模式</span>: <span class="v" id="modeVal">Follow</span></div>
    <div id="bag"><div class="title" id="bagTitle">🎒 (0/10)</div><div class="slots" id="slots"></div></div>
    <div id="catchHint">🎯 待收服!掟精靈球!</div>
    <div id="controls">
      <button id="modeBtn"><span class="btn-icon">🎯</span><span id="modeBtnLbl">模式</span></button>
      <button id="throwBtn"><span class="btn-icon">🎯</span>掟</button>
      <button id="summonBtn"><span class="btn-icon">🐾</span><span id="summonLbl">召喚</span></button>
    </div>
    <div id="modeMenu">
      <button style="background:#2d7ff9" data-m="follow">👟 Follow Me</button>
      <button style="background:#b8860b" data-m="flag">🚩 插旗(集合點)</button>
      <button style="background:#7a5af0" data-m="random">🎲 Random</button>
    </div>
    <div class="overlay" id="pick">
      <h1>🎮 Pokemon Arena</h1>
      <p>5 分鐘捕捉 + 對戰!掟精靈球收服中立怪(每球-5HP),召喚寵物幫你打。</p>
      <h2>揀你嘅初始夥伴</h2>
      <div class="ch" id="chPicks"></div>
      <button id="pickGo">▶ 進入競技場</button>
    </div>
    <div class="overlay" id="end">
      <h2>⏱ 時間到!</h2>
      <div class="big" id="endScore"></div>
      <div class="det" id="endDetail"></div>
      <button id="againBtn">🔄 再玩一次</button>
    </div>
  </div>
</div>

<script>
// ===== Pokemon 圖鑑（10 隻，完整 stats） =====
// hp/mp/攻/速/攻擊方法/技能，稀有度 0常見→3罕有
const POKEDEX = [
  {id:1, name:'妙蛙種子', type:'草',  emoji:'🐢', color:'#7ac74f', hp:60, mp:40, atk:10, atkSpd:1.4, skill:{name:'藤鞭',mp:10,atk:22,range:150,effect:'snare'}, rarity:2},
  {id:2, name:'小火龍',   type:'火',  emoji:'🦎', color:'#ee8130', hp:55, mp:36, atk:12, atkSpd:1.3, skill:{name:'火焰噴射',mp:12,atk:26,range:160,effect:'burn'}, rarity:2},
  {id:3, name:'車厘龜',   type:'水',  emoji:'🐢', color:'#6390f0', hp:80, mp:44, atk:8,  atkSpd:1.8, skill:{name:'水炮',mp:8,atk:18,range:150,effect:'knockback'}, rarity:2},
  {id:4, name:'皮卡丘',   type:'電',  emoji:'🐭', color:'#f7d02c', hp:45, mp:50, atk:14, atkSpd:0.7, skill:{name:'十萬伏特',mp:15,atk:28,range:170,effect:'chain'}, rarity:1},
  {id:5, name:'波波',     type:'飛行',emoji:'🐦', color:'#a8b7c7', hp:40, mp:28, atk:7,  atkSpd:0.6, skill:{name:'烈暴風',mp:6,atk:15,range:130,effect:'aoe'}, rarity:1},
  {id:6, name:'小拳石',   type:'岩',  emoji:'🪨', color:'#b6a136', hp:95, mp:34, atk:15, atkSpd:2.2, skill:{name:'滾石',mp:15,atk:32,range:160,effect:'heavy'}, rarity:3},
  {id:7, name:'綠毛蟲',   type:'蟲',  emoji:'🐛', color:'#a6b91a', hp:30, mp:20, atk:4,  atkSpd:2.0, skill:{name:'吐絲',mp:5,atk:8,range:120,effect:'slow'}, rarity:0},
  {id:8, name:'比比鳥',   type:'飛行',emoji:'🦅', color:'#6d8fc7', hp:65, mp:32, atk:11, atkSpd:1.0, skill:{name:'翅膀攻擊',mp:10,atk:22,range:140,effect:'strike'}, rarity:2},
  {id:9, name:'伊布',     type:'普通',emoji:'🦊', color:'#c98b9e', hp:50, mp:40, atk:9,  atkSpd:1.2, skill:{name:'電光一閃',mp:8,atk:20,range:150,effect:'dash'}, rarity:1},
  {id:10,name:'鯉魚王',   type:'水',  emoji:'🐟', color:'#f0908c', hp:20, mp:15, atk:2,  atkSpd:2.5, skill:{name:'水濺',mp:3,atk:5,range:100,effect:'splash'}, rarity:0}
];
const STARTERS=[4,9,1]; // 皮卡丘/伊布/妙蛙種子 初始三選一
const RARITY_WEIGHT=[0,0,0,0,1,1,2,2,3];

// 屬性相剋（攻擊方: 對 防守方）x0.5 / x1 / x2
const TYPE_CHART={
  草:  {火:0.5,水:2,岩:2,飛行:0.5,蟲:0.5,普通:1,電:1,草:0.5},
  火:  {草:2,水:0.5,岩:0.5,飛行:1,蟲:2,普通:1,電:1,火:0.5},
  水:  {火:2,草:0.5,岩:2,飛行:1,蟲:1,普通:1,電:1,水:0.5},
  電:  {水:2,飛行:2,草:0.5,電:0.5,岩:1,普通:1,火:1,蟲:1},
  飛行:{草:2,火:1,水:1,電:0.5,岩:0.5,普通:1,蟲:2,飛行:1},
  岩:  {火:2,飛行:2,草:1,水:1,普通:1,電:1,蟲:2,岩:0.5},
  蟲:  {草:2,火:0.5,飛行:0.5,岩:1,普通:1,電:1,水:1,蟲:1},
  普通:{草:1,火:1,水:1,電:1,飛行:1,岩:0.5,蟲:1,普通:1}
};
function typeMult(att,def){ return (TYPE_CHART[att]&&TYPE_CHART[att][def])||1; }

// ===== DOM =====
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0;
function resize(){ W=cv.width=document.getElementById('gamewrap').clientWidth; H=cv.height=document.getElementById('gamewrap').clientHeight; }
resize(); window.addEventListener('resize',resize);

// ===== 遊戲狀態 =====
let playing=false, over=false, started=false;
let timeLeft=5*60; const GAME_DURATION=5*60;
let lastT=0, dt=0;
let joyVec={x:0,y:0}; const keys={};
let bag=[]; const MAX_BAG=10;           // bag 每格 {dex, hp, mp}（實際狀態）
let team=[];                             // 已召喚出嚟嘅寵（對應 bag index）
let flagPt=null;                         // 插旗集合點
let ctrlMode='follow';
let dropBalls=[];                        // 死咗跌出嚟嘅精靈球（原玩家執返）
const player={x:0,y:0,r:16,spd:220};
let wilds=[], balls=[], npcs=[], flashMsgs=[];
let wins=0, losses=0;

// ===== 工具 =====
function flashText(msg,x,y,color){ flashMsgs.push({msg,x,y,color,t:performance.now(),life:1.4}); }
function shuffle(a){ for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function randWild(){
  const rar=RARITY_WEIGHT[Math.floor(Math.random()*RARITY_WEIGHT.length)];
  const c=POKEDEX.filter(p=>p.rarity===rar);
  return c[Math.floor(Math.random()*c.length)];
}

// ===== 野怪生成（含「待收服」狀態） =====
let pendingCount=0;
function spawnW()
{
  if(!isFinite(W)||W<100){ W=document.getElementById('gamewrap').clientWidth||1280; H=document.getElementById('gamewrap').clientHeight||664; }
  const n=randWild();
  wilds.push({dex:n,x:50+Math.random()*(W-100),y:40+Math.random()*(H-150),hp:n.hp,maxHp:n.hp,r:22,dir:Math.random()*6.28,roamT:0,pending:false,pendingT:0,hitT:0});
}
function MAXW(){ return Math.max(5,Math.floor(W*H/50000)); }
function fillWilds(){
  // 唔計 pending，保持有怪
  while(wilds.filter(w=>!w.pending).length<MAXW()) spawnW();
}

// ===== 掟精靈球（無限，自動瞄準最近目標） =====
function throwBall(tx,ty){
  // 每 2 秒先可掟一個（玩家冷卻）
  const now=performance.now();
  if(now-(player.lastThrow||0)<2000) return;
  player.lastThrow=now;
  // 若 click 點附近有野怪，向最近嗰隻瞄準（帶 target 追蹤，優先待收服）
  let tgt=null, bd=320;
  for(const w of wilds){
    if(w.hp<=0) continue;
    const d=Math.hypot(w.x-tx,w.y-ty);
    if(d<bd || (w.pending&&d<500)){ bd=d; tgt=w; }
  }
  const aimX = tgt? tgt.x:tx, aimY = tgt? tgt.y:ty;
  const dx=aimX-player.x, dy=aimY-player.y, d=Math.hypot(dx,dy)||1;
  const sp=Math.min(640,d*6);
  balls.push({x:player.x,y:player.y,vx:dx/d*sp,vy:dy/d*sp,r:10,life:2.0,tgt: tgt||null});
}
// 球追蹤目標
function steerBall(b,dtS){
  if(b.tgt && b.tgt.hp>0){
    const dx=b.tgt.x-b.x, dy=b.tgt.y-b.y, d=Math.hypot(dx,dy);
    if(d>5){ b.vx=dx/d*720; b.vy=dy/d*720; }
  }
}
// NPC 掟
function npcThrow(n,x,y){
  const dx=x-n.x,dy=y-n.y,d=Math.hypot(dx,dy)||1;
  balls.push({x:n.x,y:n.y,vx:dx/d*650,vy:dy/d*650,r:9,life:1.6,npc:true,owner:n});
}

// ===== 收服（精靈球掟中） =====
// owner: null/undefined = 玩家球；{npc,ref} = NPC球
function tryCatch(w, owner){
  if(owner && owner.npc){
    // NPC 掟中
    if(w.pending){ flashText('搶走!',w.x,w.y-30,'#f66'); removeWild(w); return; }
    w.hp-=5; w.hitT=performance.now(); flashText('-5',w.x,w.y-30,'#ff5a5a');
    if(w.hp<=0){ if(owner.ref && owner.ref.bag.length<MAX_BAG){ owner.ref.bag.push({dex:w.dex,hp:w.dex.hp,mp:w.dex.mp}); flashText(owner.ref.name+'收服!',w.x,w.y-30,'#ffd24a'); } removeWild(w); }
    return;
  }
  // 玩家掟中
  if(w.pending){
    if(bag.length>=MAX_BAG){ flashText('🎒 滿!',w.x,w.y-30,'#f66'); return; }
    bag.push({dex:w.dex,hp:w.dex.hp,mp:w.dex.mp});
    flashText('收服!'+w.dex.name+' ✓',w.x,w.y-30,'#ffd24a');
    document.getElementById('catchHint').style.display='none';
    removeWild(w); updateBagUI(); updateScoreUI();
    return;
  }
  w.hp-=5; w.hitT=performance.now(); flashText('-5',w.x,w.y-30,'#ff5a5a');
  if(w.hp<=0){
    if(bag.length>=MAX_BAG){ flashText('🎒 滿!',w.x,w.y-30,'#f66'); /*變pending俾人執*/ w.pending=true; w.pendingT=performance.now(); w.hp=1; pendingCount++; return; }
    bag.push({dex:w.dex,hp:w.dex.hp,mp:w.dex.mp});
    flashText('收服!'+w.dex.name+' ✓',w.x,w.y-30,'#ffd24a');
    removeWild(w); updateBagUI(); updateScoreUI();
  }
}
function removeWild(w){
  const i=wilds.indexOf(w); if(i>=0) wilds.splice(i,1);
  if(w.pending) pendingCount--;
}

// ===== 寵物死亡 → 變精靈球 =====
function dropBallFrom(owner,bagIdx,dex,x,y){
  dropBalls.push({owner,bagIdx,dex,x,y,hp:0,regenStart:performance.now()});
}
function pickupDrop(d,byPlayer){
  // 只可以由原玩家執返（byPlayer=true 且 owner 係該玩家）
  if(byPlayer && d.owner==='player') return true;
  // NPC：自己執返自己啲
  if(!byPlayer && d.owner && d.owner.npc) return true;
  return false;
}

// ===== 召喚 / 收回 =====
function isFullHp(bi){ return bag[bi] && bag[bi].hp>=bag[bi].dex.hp; }
function summon(bi){
  if(team.includes(bi)) return;
  if(!bag[bi]) return;
  if(bag[bi].hp<bag[bi].dex.hp){ flashText('未滿血!',player.x,player.y-30,'#f66'); return; }
  team.push(bi);
  // 喺玩家身邊生成出戰寵物
  // (位置喺 update 跟控制模式行)
}
function recallAll(){
  // 收回所有（唔係死亡，直接返箱，狀態保留）
  team=[];
}

// ===== 出戰寵物 =====
// 放出 = 離開物品箱（袋少一格）；死亡/收回先放返入箱
let pets=[];   // pets 每隻 = 袋外嘅出場寵
function summonPet(bi){
  if(!bag[bi]) return;
  if(bag[bi].hp<bag[bi].dex.hp){ flashText('未滿血先可召喚',player.x,player.y-30,'#f66'); return; }
  const d=bag[bi].dex;
  // 由袋移走（放出 = 離開箱）
  const [slot]=bag.splice(bi,1);
  pets.push({bi:-1, dex:d, hp:slot.hp, mp:slot.mp, x:player.x+(Math.random()*40-20), y:player.y+(Math.random()*40-20), atkCd:0, skillCd:0});
  flashText('出戰!'+d.name,player.x,player.y-40,'#7CFC00');
  updateBagUI();
}
// 收回所有放返入箱
function recallPets(){
  for(const p of pets){ bag.push({dex:p.dex,hp:p.hp,mp:p.mp}); }
  pets=[];
  updateBagUI();
}
// 點按 slot → 放出
function togglePet(bi){
  if(!bag[bi]) return;
  summonPet(bi);
}

// ===== 對戰：寵物打中立怪(NPC寵磨血到HP1)/敵人寵 =====
function petMoveToward(p, tx, ty, dt){
  const a=Math.atan2(ty-p.y, tx-p.x);
  const mv = 40;  // 統一寵物移動速度
  p.x+=Math.cos(a)*mv*dt;
  p.y+=Math.sin(a)*mv*dt;
}
function petFight(p,dt,ownerFlag){
  let hasTarget=false;
  // 搵目標：先敵方寵(其他 owner)，後中立怪(磨到HP1)
  let target=null, best=1e9;
  // NPC 寵（若玩家寵，target NPC 嘅 pets；若 NPC 寵，target 玩家寵）
  const enemies = ownerFlag==='player' ? npcs.flatMap(n=>n.pets||[]).filter(x=>x.hp>0) : pets.filter(x=>x.hp>0);
  for(const e of enemies){
    const d=Math.hypot(e.x-p.x,e.y-p.y);
    if(d<p.dex.skill.range+45 && d<best){ best=d; target=e; enemyIsWild=false; }
  }
  if(!target){
    for(const w of wilds){
      if(w.pending || w.hp<=1) continue;
      const d=Math.hypot(w.x-p.x,w.y-p.y);
      if(d<p.dex.skill.range+45 && d<best){ best=d; target=w; enemyIsWild=true; }
    }
  }
  if(!target){
    // 無目標就按控制模式行
    return false;
  }
  hasTarget=true;
  // 行向 target
  petMoveToward(p,target.x,target.y,dt);
  p.atkCd-=dt;
  if(p.atkCd<=0 && Math.hypot(target.x-p.x,target.y-p.y)<p.dex.skill.range){
    p.atkCd=p.dex.atkSpd;
    const mult=target.dex?typeMult(p.dex.type,target.dex.type):1;
    const aa=p.dex.atk*mult;
    if(!enemyIsWild){
      // 敵方寵：正常扣血
      target.hp-=aa;
      p.mp=Math.min(p.dex.mp,p.mp+2);   // 攻擊回MP
      flashText('-'+Math.round(aa),target.x,target.y-28,'#ff5a5a');
      target.hitT=performance.now();
      if(target.hp<=0){ flashText('擊敗!'+target.dex.name,target.x,target.y-30,'#7CFC00'); onPetDown(target); wins++; }
    } else {
      // 中立怪：只磨到 HP1
      target.hp=Math.max(1,target.hp-aa);
      flashText('-'+Math.round(aa),target.x,target.y-28,'#fff');
      if(target.hp<=1){ target.pending=true; target.pendingT=performance.now(); pendingCount++; }
    }
  }
  return hasTarget;
}
function onPetDown(pet){
  // 寵物死亡：變精靈球，原玩家/NPC 要執返（執返先放返入箱）
  const owner = pet.ownerNpc ? {npc:true, ref:pet.ownerNpc} : 'player';
  dropBalls.push({owner, dex:pet.dex, x:pet.x, y:pet.y, t:performance.now()});
  // 從 pets 移除
  const ci = pet.ownerNpc ? pet.ownerNpc.pets.indexOf(pet) : pets.indexOf(pet);
  if(ci>=0) (pet.ownerNpc?pet.ownerNpc.pets:pets).splice(ci,1);
}

// ===== NPC 玩家 =====
function spawnNPCs(n){
  npcs=[];
  const colors=['#ff6b6b','#6bc0ff','#ffd24a'];
  for(let i=0;i<n;i++){
    npcs.push({
      x:50+Math.random()*(W-100), y:40+Math.random()*(H-150), r:16,
      color:colors[i%3], name:'對手'+(i+1),
      spd:110, throwT:0, pets:[], bag:[], ctrl:'random',
      stun:0
    });
  }
}
function updateNPC(n,dt){
  // 移動：去最近野怪
  let tw=null, bw=1e9;
  for(const w of wilds){
    if(w.pending) continue;
    const d=Math.hypot(w.x-n.x,w.y-n.y);
    if(d<bw){ bw=d; tw=w; }
  }
  const a = tw?Math.atan2(tw.y-n.y,tw.x-n.x):0;
  n.x+=Math.cos(a)*n.spd*dt; n.y+=Math.sin(a)*n.spd*dt;
  n.x=Math.max(20,Math.min(W-20,n.x)); n.y=Math.max(20,Math.min(H-20,n.y));
  // 掟球（向最近野怪）— NPC 隔 3 秒先掟一個
  n.throwT-=dt;
  if(tw && bw<220 && n.throwT<=0){
    n.throwT=3.0;
    npcThrow(n,tw.x,tw.y);
  }
  // NPC 有寵就出戰（自動召喚）
  if(n.pets.length===0 && n.bag.length>0 && n.bag[0].hp>=n.bag[0].dex.hp){
    const d=n.bag.shift();
    const pet={bi:-1,dex:d.dex,hp:d.hp,mp:d.mp,x:n.x+10,y:n.y+10,atkCd:0,ownerNpc:n};
    n.pets.push(pet);
  }
  // 寵物打玩家寵/中立怪
  for(const p of [...n.pets]) petFight(p,dt,'npc');
  // 執返自己跌嘅精靈球
  for(const db of [...dropBalls]){
    if(db.owner&&db.owner.npc&&db.owner.ref===n){
      if(Math.hypot(db.x-n.x,db.y-n.y)<40){
        const n2=dropBalls.indexOf(db); dropBalls.splice(n2,1);
        n.bag.push({dex:db.dex,hp:1,mp:0}); // 執返，回血中
      }
    }
  }
}

// ===== 繪圖 =====
function drawGrass(){
  ctx.fillStyle='#3a8f4f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<110;i++){
    ctx.fillStyle='rgba(90,160,70,.25)';
    ctx.beginPath(); ctx.ellipse(Math.random()*W,Math.random()*H,10+Math.random()*14,6+Math.random()*8,Math.random()*3.14,0,6.28); ctx.fill();
  }
}
function drawWild(w){
  const flash=w.hitT&&(performance.now()-w.hitT)<150;
  const x=w.x,y=w.y;
  ctx.fillStyle=w.dex.color; ctx.globalAlpha=0.15;
  ctx.beginPath(); ctx.arc(x,y,w.r+6,0,6.28); ctx.fill(); ctx.globalAlpha=1;
  if(flash) ctx.filter='brightness(1.8)';
  ctx.font=(w.r*1.4)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(w.dex.emoji,x,y); ctx.filter='none';
  // HP bar
  const bw=40,bh=5,ratio=Math.max(0,w.hp/w.maxHp);
  ctx.fillStyle='#333'; ctx.fillRect(x-bw/2,y-w.r-14,bw,bh);
  ctx.fillStyle = w.pending ? '#ffd24a' : (ratio>0.5?'#4caf50':(ratio>0.25?'#ffc107':'#f44336'));
  ctx.fillRect(x-bw/2,y-w.r-14,bw*ratio,bh);
  ctx.font='10px sans-serif'; ctx.fillStyle='#eef'; ctx.fillText(w.dex.name,x,y-w.r-18);
  // 待收服：閃框 + 倒數
  if(w.pending){
    ctx.strokeStyle='#ffd24a'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,y,w.r+10,0,6.28); ctx.stroke();
    const left=Math.max(0,60-Math.floor((performance.now()-w.pendingT)/1000));
    ctx.fillStyle='#ffd24a'; ctx.font='bold 12px sans-serif';
    ctx.fillText('⚡'+left,x,y+w.r+20);
  }
}
function drawPet(p){
  const x=p.x,y=p.y;
  ctx.fillStyle=p.dex.color; ctx.globalAlpha=0.2;
  ctx.beginPath(); ctx.arc(x,y,16,0,6.28); ctx.fill(); ctx.globalAlpha=1;
  ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(p.dex.emoji,x,y);
  // HP bar
  const bw=30,bh=4,ratio=Math.max(0,p.hp/p.dex.hp);
  ctx.fillStyle='#333'; ctx.fillRect(x-bw/2,y-26,bw,bh);
  ctx.fillStyle=ratio>0.5?'#4caf50':'#f44336'; ctx.fillRect(x-bw/2,y-26,bw*ratio,bh);
}
function drawPlayer(){
  ctx.fillStyle='#4a95ff'; ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,6.28); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🧑',player.x,player.y);
  const a=Math.atan2(joyVec.y,joyVec.x);
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(player.x,player.y); ctx.lineTo(player.x+Math.cos(a)*28,player.y+Math.sin(a)*28); ctx.stroke();
}
function drawNPC(n){
  ctx.fillStyle=n.color; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.28); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('👤',n.x,n.y);
  // 畫佢啲寵
  for(const p of n.pets) drawPet(p);
}
function drawBall(b){
  const t=performance.now(), arcY=Math.sin((t/80)%Math.PI)*-8;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y+arcY,b.r,0,6.28); ctx.fill();
  ctx.fillStyle='#c2300f'; ctx.beginPath(); ctx.arc(b.x,b.y+arcY,b.r*0.55,0,6.28); ctx.fill();
  ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(b.x,b.y+arcY,b.r,0,6.28); ctx.stroke();
}
function drawDrop(db){
  const t=performance.now(), arcY=Math.sin((t/60)%Math.PI)*-4;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(db.x,db.y+arcY,8,0,6.28); ctx.fill();
  ctx.fillStyle='#c2300f'; ctx.beginPath(); ctx.arc(db.x,db.y+arcY,4.5,0,6.28); ctx.fill();
  // 剩餘時間（30 秒倒數）
  const left=Math.max(0,30-Math.floor((t-db.t)/1000));
  ctx.fillStyle='#ffd24a'; ctx.font='10px sans-serif'; ctx.textAlign='center';
  ctx.fillText('⏳'+left,db.x,db.y-16);
  ctx.fillStyle='#9ab'; ctx.font='9px sans-serif';
  ctx.fillText('行近執返',db.x,db.y+18);
}
function drawFlag(){
  if(!flagPt) return;
  ctx.fillStyle='#ffd24a'; ctx.font='26px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🚩',flagPt.x,flagPt.y);
}
function drawFlash(){
  const now=performance.now();
  for(let i=flashMsgs.length-1;i>=0;i--){
    const f=flashMsgs[i],age=(now-f.t)/1000;
    if(age>f.life){ flashMsgs.splice(i,1); continue; }
    ctx.globalAlpha=1-age/f.life; ctx.fillStyle=f.color; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
    ctx.fillText(f.msg,f.x,f.y-age*20); ctx.globalAlpha=1;
  }
}

// ===== UI =====
function updateTimerUI(){
  const m=Math.floor(timeLeft/60), s=Math.floor(timeLeft%60);
  document.getElementById('timer').textContent=m+':'+(s<10?'0':'')+s;
}
function updateScoreUI(){ document.getElementById('score').textContent='捉 '+bag.length+' · ⚔'+wins; }
function updateBagUI(){
  document.getElementById('bagTitle').textContent='🎒 ('+bag.length+'/'+MAX_BAG+')';
  const slots=document.getElementById('slots'); slots.innerHTML='';
  for(let i=0;i<MAX_BAG;i++){
    const s=document.createElement('div');
    s.className='slot'+(i<bag.length?'':' empty');
    if(i<bag.length){
      s.textContent=bag[i].dex.emoji;
      // 點按 → 放出（離開物品箱）
      s.style.cursor='pointer';
      s.addEventListener('click',()=>togglePet(i));
      // 血量 mini bar
      const m=document.createElement('div'); m.className='hpmini';
      const r=document.createElement('i');
      r.style.width=Math.max(0,bag[i].hp/bag[i].dex.hp*100)+'%';
      r.style.background=bag[i].hp>=bag[i].dex.hp?'#4caf50':'#f44336';
      m.appendChild(r); s.appendChild(m);
    }
    slots.appendChild(s);
  }
}

// ===== 控制模式 =====
function setMode(m){
  ctrlMode=m;
  document.getElementById('modeVal').textContent = m==='follow'?'Follow Me':(m==='flag'?'插旗':'Random');
  document.getElementById('modeBtnLbl').textContent = m==='follow'?'跟隨':(m==='flag'?'插旗':'隨機');
  if(m==='flag'&&!flagPt){ flagPt={x:player.x,y:player.y}; flashText('插旗!',flagPt.x,flagPt.y-20,'#b8860b'); }
  document.getElementById('modeMenu').style.display='none';
}

// ===== 主更新 =====
function update(dtS){
  if(over) return;
  timeLeft-=dtS;
  if(timeLeft<=0){ timeLeft=0; endGame(); return; }
  updateTimerUI();

  // 物品箱內寵物每 1 秒補 1 HP（滿血先可再召喚）
  for(const s of bag){
    if(s.hp<s.dex.hp){
      s.healAcc=(s.healAcc||0)+dtS;
      while(s.healAcc>=1 && s.hp<s.dex.hp){ s.hp++; s.healAcc-=1; }
    }
  }

  // 玩家移動
  const mvx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0);
  const mvy=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);
  let ix=(mvx||mvy)?mvx:joyVec.x, iy=(mvx||mvy)?mvy:joyVec.y;
  const mag=Math.hypot(ix,iy);
  if(mag>1){ ix/=mag; iy/=mag; }
  player.x+=ix*player.spd*dtS; player.y+=iy*player.spd*dtS;
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));

  // 掟球（撳住掟掣）
  if(throwHold){
    let tx=player.x+ix*200, ty=player.y+iy*200;
    if(mag===0){
      let b=1e9;
      for(const w of wilds){ const d=Math.hypot(w.x-player.x,w.y-player.y); if(!w.pending&&d<b){b=d;tx=w.x;ty=w.y;} }
      if(b===1e9){ tx=player.x; ty=player.y-200; }
    }
    throwBall(tx,ty);
  }

  // 玩家寵物：控制模式 + 對戰
  for(const p of [...pets]){
    const toTarget = petFight(p,dtS,'player');   // 返回有冇追蹤緊目標
    // 控制模式（冇目標追蹤時先按模式行）
    if(!toTarget){
      if(ctrlMode==='follow'){
        petMoveToward(p,player.x,player.y,dtS);
      } else if(ctrlMode==='flag'&&flagPt){
        petMoveToward(p,flagPt.x,flagPt.y,dtS);
      } else {
        // random：自由隨機踱步
        p.wanderT=(p.wanderT||0)-dtS;
        if(p.wanderT<=0){ p.wanderT=1.5+Math.random()*2.5; p.wanderA=Math.random()*6.28; }
        petMoveToward(p, p.x+Math.cos(p.wanderA)*60, p.y+Math.sin(p.wanderA)*60, dtS);
      }
    }
  }

  // 野怪：徘徊 / 待收服倒數
  for(const w of [...wilds]){
    if(w.pending){
      if(performance.now()-w.pendingT>60000){ removeWild(w); document.getElementById('catchHint').style.display='none'; continue; }
      continue; // 待收服唔郁
    }
    w.roamT-=dtS;
    if(w.roamT<=0){ w.roamT=1.5+Math.random()*2.5; w.dir=Math.random()*6.28; }
    w.x+=Math.cos(w.dir)*30*dtS;
    w.y+=Math.sin(w.dir)*30*dtS;
    w.x=Math.max(20,Math.min(W-20,w.x)); w.y=Math.max(20,Math.min(H-20,w.y));
  }
  if(pendingCount>0) document.getElementById('catchHint').style.display='block';
  else document.getElementById('catchHint').style.display='none';
  fillWilds();

  // NPC
  for(const n of npcs) updateNPC(n,dtS);

  // 精靈球碰撞
  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i];
    b.x+=b.vx*dtS; b.y+=b.vy*dtS; b.life-=dtS;
    if(b.life<=0){ balls.splice(i,1); continue; }
    steerBall(b,dtS);
    // 撞中立怪
    for(const w of wilds){
      if(Math.hypot(b.x-w.x,b.y-w.y)<b.r+w.r){
        balls.splice(i,1);
        tryCatch(w,b.owner||null);
        break;
      }
    }
  }

  // 精靈球過期（30 秒內唔回收就消失）＋ 玩家執返
  for(let i=dropBalls.length-1;i>=0;i--){
    const db=dropBalls[i];
    // 30 秒過期消失
    if(performance.now()-db.t>30000){ dropBalls.splice(i,1); continue; }
    // 玩家執返自己
    if(db.owner==='player' && Math.hypot(db.x-player.x,db.y-player.y)<45){
      if(bag.length>=MAX_BAG){ flashText('🎒 滿! 執唔到',db.x,db.y-20,'#f66'); continue; } // 箱滿留地面
      dropBalls.splice(i,1);
      bag.push({dex:db.dex,hp:1,mp:0});   // 執返入箱，hp 由 1 開始回血
      flashText('執返'+db.dex.name+' ✓',player.x,player.y-30,'#7CFC00');
      updateBagUI();
      continue;
    }
  }
  updateScoreUI();
}

// ===== 渲染 =====
function render(){
  drawGrass();
  for(const w of wilds) drawWild(w);
  for(const db of dropBalls) drawDrop(db);
  drawFlag();
  for(const n of npcs) drawNPC(n);
  for(const b of balls) drawBall(b);
  for(const p of pets) drawPet(p);
  drawPlayer();
  drawFlash();
}

// ===== 輸入 =====
document.addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if(e.key.toLowerCase()===' ') throwHold=true; });
document.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; if(e.key.toLowerCase()===' ') throwHold=false; });
let throwHold=false;
cv.addEventListener('pointerdown',e=>{
  if(!playing||over) return;
  const rect=cv.getBoundingClientRect();
  const tx=(e.clientX-rect.left)*W/rect.width, ty=(e.clientY-rect.top)*H/rect.height;
  throwBall(tx,ty);
});
const throwBtn=document.getElementById('throwBtn');
throwBtn.addEventListener('touchstart',e=>{ e.preventDefault(); if(playing&&!over) throwHold=true; });
throwBtn.addEventListener('touchend',e=>{ e.preventDefault(); throwHold=false; });
throwBtn.addEventListener('mousedown',e=>{ if(playing&&!over) throwHold=true; });
throwBtn.addEventListener('mouseup',e=>{ throwHold=false; });

// 搖桿
const joy=document.getElementById('joy'), knob=document.getElementById('knob');
let joyId=null;
joy.addEventListener('touchstart',e=>{ e.preventDefault(); joyId=e.touches[0].identifier; updateJoy(e.touches[0]); });
joy.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.touches){ if(t.identifier===joyId) updateJoy(t); } });
joy.addEventListener('touchend',()=>{ joyVec={x:0,y:0}; knob.style.left='32px'; knob.style.top='32px'; joyId=null; });
joy.addEventListener('touchcancel',()=>{ joyVec={x:0,y:0}; knob.style.left='32px'; knob.style.top='32px'; joyId=null; });
function updateJoy(t){
  const rect=joy.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  let dx=t.clientX-cx, dy=t.clientY-cy;
  const max=rect.width/2-23, m=Math.hypot(dx,dy);
  if(m>max){ dx=dx/m*max; dy=dy/m*max; }
  knob.style.left=(dx+max)+'px'; knob.style.top=(dy+max)+'px';
  joyVec={x:dx/max, y:dy/max};
}

// 控制掣
document.getElementById('modeBtn').addEventListener('click',()=>{
  const mm=document.getElementById('modeMenu');
  mm.style.display = mm.style.display==='flex'?'none':'flex';
});
document.querySelectorAll('#modeMenu button').forEach(b=> b.addEventListener('click',()=>setMode(b.dataset.m)));
document.getElementById('summonBtn').addEventListener('click',()=>{
  // 全隊：如果冇寵出場就全召喚，有就全收回
  if(pets.length===0){
    for(let i=0;i<bag.length;i++) summonPet(i);
    document.getElementById('summonLbl').textContent='收回';
  } else {
    recallPets();
    document.getElementById('summonLbl').textContent='召喚';
  }
});

// ===== 開始 / 結束 / 三選一 =====
function startGame(){
  resize();  // 確保 W/H 有效
  playing=true; over=false;
  timeLeft=GAME_DURATION; wins=0; losses=0;
  wilds=[]; balls=[]; npcs=[]; pets=[]; dropBalls=[]; flashMsgs=[];
  flagPt=null; ctrlMode='follow'; setMode('follow');
  player.x=W/2; player.y=H/2;
  fillWilds(); spawnNPCs(3);
  updateBagUI(); updateScoreUI(); updateTimerUI();
  document.getElementById('pick').style.display='none';
  document.getElementById('end').style.display='none';
  document.getElementById('controls').style.display='flex';
  document.getElementById('modeState').style.display='block';
  document.getElementById('joy').style.display=('ontouchstart' in window)?'block':'none';
  lastT=performance.now();
  requestAnimationFrame(loop);
}
function endGame(){
  over=true; playing=false;
  const score=bag.length*10 + new Set(bag.map(p=>p.dex.type)).size*25 + wins*30 - losses*5;
  document.getElementById('endScore').textContent='總分 '+Math.max(0,score);
  const types=new Set(bag.map(p=>p.dex.type)).size;
  document.getElementById('endDetail').innerHTML=
    '🎒 物品箱: '+bag.length+'/'+MAX_BAG+'<br>'+
    '🧬 種類: '+types+' 種<br>'+
    '⚔ 對戰勝仗: '+wins+' · 敗仗: '+losses;
  document.getElementById('controls').style.display='none';
  document.getElementById('modeState').style.display='none';
  document.getElementById('end').style.display='flex';
}
function loop(t){
  dt=(t-lastT)/1000; lastT=t;
  if(dt>0.1) dt=0.1;
  update(dt); render();
  if(!over) requestAnimationFrame(loop);
}
// 三選一
let pickSel=null;
const chPicks=document.getElementById('chPicks');
for(const id of STARTERS){
  const d=POKEDEX.find(x=>x.id===id);
  const c=document.createElement('div'); c.className='c'; c.dataset.id=id;
  c.innerHTML='<div class="emo">'+d.emoji+'</div><div class="nm">'+d.name+'</div><div class="tp">'+d.type+'系</div><div class="st">HP'+d.hp+' · 攻'+d.atk+'</div>';
  c.addEventListener('click',()=>{ pickSel=id; chPicks.querySelectorAll('.c').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); });
  chPicks.appendChild(c);
}
document.getElementById('pickGo').addEventListener('click',()=>{
  if(!pickSel){ flashText('先揀一隻!',W/2,H/2,'#f66'); return; }
  const d=POKEDEX.find(x=>x.id===pickSel);
  bag.push({dex:d,hp:d.hp,mp:d.mp});   // 初始夥伴入箱
  updateBagUI();
  startGame();
});
document.getElementById('againBtn').addEventListener('click',()=>{
  bag=[]; pickSel=null;
  document.getElementById('end').style.display='none';
  document.getElementById('pick').style.display='flex';
});
render();
</script>
